# Pipeline de PR de Ladino — DEVOPS_CI_CD.md
#
# CI corre SOLO en Node 22 LTS. Si algo diverge entre un portátil con Node 26 y este pipeline,
# gana CI y se arregla el código, no el pipeline: la reproducibilidad vive donde se construye
# el artefacto.
#
# Los pasos van como jobs separados y no como un solo `pnpm verify`, para que la matriz diga
# cuál falló sin tener que leer el log — y ADEMÁS corre `full-gate`, que es el `pnpm verify`
# entero con el stack local de Supabase levantado: migración desde cero, integración de la API
# contra Postgres real, pgTAP, openapi:check y release manifest. La matriz es la señal rápida;
# full-gate es la autoridad.
#
# HISTORIA QUE NO DEBE REPETIRSE: desde S0.5 el paso `test` incluía la integración contra
# Postgres y este pipeline no levantaba ninguno — el job llevaba semanas en rojo en cada push
# sin que nadie lo mirara. Un CI rojo permanente es un CI apagado (ADR-0023, otra vez): si
# full-gate se pone rojo y no es por el cambio, se ARREGLA EL PIPELINE ese mismo día.

name: CI

# Se dispara en TODA rama, no solo en main.
#
# La configuración original (`push: [main]` + `pull_request`) no ejecutaba nada al empujar una
# rama de trabajo sin PR abierto: cero runs, cero fallos, cero señal. Es el mismo modo de avería
# que el hallazgo de `exportsFields` en ADR-0021 — la ausencia de fallo se lee como éxito. Un
# pipeline que solo corre en main descubre los problemas después de mergear, que es tarde.
on:
  push:
  pull_request:

# Evita el run duplicado (push + pull_request) sobre la misma rama y cancela el anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Corepack pide confirmación interactiva al descargar un packageManager que no trae fijado.
  # En CI no hay nadie para responder: el job se cuelga hasta el timeout.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  setup:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Habilitar corepack
        # Un `packageManager` que nadie hace cumplir da falsa sensación de gestor fijado.
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Comprobar que el lockfile no cambió
        run: git diff --exit-code pnpm-lock.yaml

  quality:
    name: ${{ matrix.step }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        # `test` NO está aquí: necesita Postgres (integración de la API,
        # ADR-0016) y corre dentro de full-gate con el stack levantado.
        step: ["format:check", "boundaries", "lint", "typecheck", "build"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.step }}

  api-surface:
    name: api-surface (ningún `number` en la API pública de money)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run api-surface

  full-gate:
    name: pnpm verify (los 11 pasos, con Postgres real)
    runs-on: ubuntu-latest
    needs: setup
    # El gate entero tarda; que la matriz rápida ya haya dado su señal no lo
    # exime: este job es EL veredicto, el mismo que en la máquina de desarrollo.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Levantar el stack local de Supabase (Docker del runner)
        run: pnpm db:start
      - name: pnpm verify — el gate real, entero
        run: pnpm run verify
      - name: El veredicto se lee por pasos, no a ojo (CLAUDE.md §5)
        # En esta máquina el log se cuenta; aquí el exit code manda, pero se
        # deja constancia de que el pgTAP corrió de verdad.
        run: pnpm run test:rls | grep -q "All tests successful"
