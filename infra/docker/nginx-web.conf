# ladino-web — nginx sirviendo el bundle de Vite.
#
# Dos decisiones y su porqué:
#   · SPA fallback: toda ruta desconocida devuelve index.html — react-router
#     resuelve en el cliente. Sin esto, refrescar /ventas/<id> daría 404.
#   · caché partida en dos: /assets lleva hash de contenido en el nombre y se
#     cachea UN AÑO immutable; index.html NUNCA se cachea, porque es quien
#     apunta a los assets nuevos tras cada deploy. Cachear index.html es servir
#     la versión vieja hasta que a alguien le expire, con el bundle nuevo ya
#     publicado — el clásico deploy que "no salió".
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Las cabeceras de seguridad van REPETIDAS en cada location a propósito:
  # `add_header` dentro de un location DESCARTA los heredados del server (la
  # trampa clásica de nginx — así se detectó: el smoke test del contenedor
  # servía Cache-Control y ni una cabecera de seguridad). Traefik añade las
  # suyas en el borde; estas protegen también a quien llegue por dentro de la
  # red compartida del VPS.

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ /index.html;
  }
}